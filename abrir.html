<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b33">
<title>RifaXs</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{color-scheme:dark}
  html,body{margin:0;min-height:100%;background:#0f1b33;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px;box-sizing:border-box;text-align:center}
  p{margin:0 0 14px;font-size:16px;line-height:1.4}
  a{color:#f5b829;font-weight:600;font-size:17px}
</style>
</head>
<body>
<div>
  <p>Abriendo RifaXs…</p>
  <p><a id="web" href="index.html">Ir a la rifa en la web</a></p>
</div>
<script>
(function(){
  /* Abre la app instalada con el esquema rifaxs://. Si la app no aparece, entra a la web con los mismos datos. */
  var q=location.search||'';
  var iniciado=Date.now(),salio=false;
  document.getElementById('web').href='index.html'+q;
  document.addEventListener('visibilitychange',function(){if(document.hidden)salio=true;});
  window.addEventListener('pagehide',function(){salio=true;});
  window.location.href='rifaxs://abrir'+q;
  setTimeout(function(){
    if(!salio&&Date.now()-iniciado<4000)window.location.replace('index.html'+q);
  },1500);
})();
</script>
</body>
</html>
